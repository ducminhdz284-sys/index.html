<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Bán Hàng</title>

  <style>
    body{
      font-family: Arial;
      background:#f5f5f5;
      margin:0;
      padding:20px;
    }

    h1{
      text-align:center;
    }

    .products{
      display:flex;
      gap:20px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .card{
      background:white;
      padding:15px;
      width:220px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      text-align:center;
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

    button{
      background:#007bff;
      color:white;
      border:none;
      padding:10px;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }

    .cart{
      margin-top:40px;
      background:white;
      padding:20px;
      border-radius:10px;
    }
  </style>
</head>

<body>

  <h1>SHOP BÁN HÀNG</h1>

  <div class="products">

    <div class="card">
      <img src="https://via.placeholder.com/200" alt="">
      <h3>Áo Thun</h3>
      <p>150.000đ</p>
      <button onclick="addToCart('Áo Thun',150000)">
        Thêm vào giỏ
      </button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200" alt="">
      <h3>Giày Sneaker</h3>
      <p>500.000đ</p>
      <button onclick="addToCart('Giày Sneaker',500000)">
        Thêm vào giỏ
      </button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200" alt="">
      <h3>Túi Xách</h3>
      <p>300.000đ</p>
      <button onclick="addToCart('Túi Xách',300000)">
        Thêm vào giỏ
      </button>
    </div>

  </div>

  <div class="cart">
    <h2>🛒 Giỏ Hàng</h2>

    <ul id="cart-list"></ul>

    <h3>Tổng tiền:
      <span id="total">0</span>đ
    </h3>
  </div>

  <script>

    let total = 0;

    function addToCart(name, price){

      let li = document.createElement("li");
      li.innerText = name + " - " + price.toLocaleString() + "đ";

      document.getElementById("cart-list").appendChild(li);

      total += price;

      document.getElementById("total").innerText =
      total.toLocaleString();
    }

  </script>

</body>
</html>
